{% extends 'base.html' %}
{% block title %}
    Update Todo
{% endblock title %}
{% block body %}
<h3>Update Todo</h3>
<div class="container my-4">
    <form action="/update/{{todo.sno}}" , method="post">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" name="title" value="{{todo.title}}" id="title" aria-describedby="emailHelp">
      </div>
      <div class="mb-3">
        <label for="desc" class="form-label">Desc</label>
        <input type="text" class="form-control" name="desc" value="{{todo.desc}}" id="desc">
      </div>
      <button type="submit" class="btn btn-dark">Update</button>
    </form>

  </div>
    
{% endblock body %}
